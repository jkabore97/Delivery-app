<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      Anneau de focus du clavier (système Cobalt, docs/DESIGN.md) pour toute l'application : 2 px cobalt détachés de 2 px,
      qui suivent les coins de l'élément (6,1:1 sur blanc, 5,4:1 sur canvas). :where() ne compte pas : un composant qui
      dessine son propre anneau (champ à bordure cobalt : outlineStyle « none ») l'emporte toujours.
      - data-focus-ring="inner" + data-focus-shape (src/theme.ts : FOCUS_RING_INNER, FOCUS_SHAPE) : la forme visible est
        un enfant (disque d'un bouton rond, pastille) ; l'anneau l'entoure au lieu du rectangle de la colonne.
      - data-surface="cobalt" (ON_COBALT_SURFACE) : sur une surface cobalt, anneau blanc (6,1:1) à halo cobalt.
    -->
    <style id="yaar-focus-css">
      :where(:focus-visible) {
        outline: 2px solid #2448ff;
        outline-offset: 2px;
      }
      [data-focus-ring='inner']:focus-visible {
        outline: none;
      }
      [data-focus-ring='inner']:focus-visible [data-focus-shape] {
        outline: 2px solid #2448ff;
        outline-offset: 2px;
      }
      [data-surface='cobalt'] :focus-visible,
      [data-surface='cobalt']:focus-visible:not([data-focus-ring='inner']),
      [data-surface='cobalt'] [data-focus-ring='inner']:focus-visible [data-focus-shape],
      [data-surface='cobalt'][data-focus-ring='inner']:focus-visible [data-focus-shape] {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
        box-shadow: 0 0 0 6px #2448ff !important;
      }
      [data-surface='cobalt'] [data-focus-ring='inner']:focus-visible {
        outline: none;
        box-shadow: none !important;
      }
    </style>
    <!--
      Écran de démarrage (Yaar Livraison) : affiché dès les premiers octets de la page, sans attendre le JavaScript
      (≈ 1 Mo compressé, plusieurs secondes en 3G). L'application le retire dès qu'un écran est prêt
      (src/lib/webShell.ts) ; filet de sécurité ci-dessous au bout de 20 s.
    -->
    <style id="yaar-splash-css">
      /* Couleurs du système Cobalt (src/theme.ts) ; police du système : celle de l'application n'est pas encore là. */
      #yaar-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #eef1f5;
        color: #0c1222;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 0.25s ease;
      }
      #yaar-splash .logo {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1;
      }
      #yaar-splash .logo i {
        width: 12px;
        height: 12px;
        margin-bottom: 7px;
        border-radius: 50%;
        background: #2448ff;
      }
      #yaar-splash .sub {
        font-size: 15px;
        font-weight: 600;
        color: #5b6475;
      }
      #yaar-splash .spin {
        width: 30px;
        height: 30px;
        margin-top: 22px;
        border-radius: 50%;
        border: 3px solid #e9edff;
        border-top-color: #2448ff;
        animation: yaar-spin 0.9s linear infinite;
      }
      #yaar-splash .msg {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 500;
        color: #5b6475;
      }
      @keyframes yaar-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #yaar-splash .spin {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>

  <body>
    <div id="yaar-splash" role="status" aria-live="polite">
      <div class="logo">Yaar<i></i></div>
      <div class="sub">Livraison · Ouagadougou</div>
      <div class="spin" aria-hidden="true"></div>
      <div class="msg" id="yaar-splash-text">Chargement…</div>
    </div>
    <script>
      (function () {
        var path = location.pathname;
        var conn = navigator.connection;
        // Connexion très lente (2G, « 3G lente », économie de données) : même règle que src/lib/webShell.ts.
        var slow = !!conn && (conn.saveData === true || /(^|-)2g$/.test(conn.effectiveType || ''));
        var suivi = path.indexOf('/suivi/') === 0;
        function preload(href, as) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = as;
          link.href = href;
          // Police et style de carte : demandés en mode CORS (@font-face, fetch()) ; sans crossorigin, le préchargement
          // ne servirait pas.
          if (as === 'font' || as === 'fetch') link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        }
        // Polices de l'application (src/fonts.ts, graisses chargées au démarrage ; liste écrite par
        // scripts/web-postexport.mjs) : téléchargées tout de suite, en parallèle du JavaScript, pour que l'application
        // s'affiche directement dans sa police. Pas sur la page publique de suivi (ouverte depuis un SMS, souvent en
        // 3G) : le JavaScript du suivi d'abord ; l'application demande les polices ensuite et les substitue à leur
        // arrivée (aussitôt quand elles sont déjà en cache), jamais sur une connexion très lente.
        var fonts = /*YAAR_FONT_PRELOAD*/[];
        if (!suivi) for (var f = 0; f < fonts.length; f++) preload(fonts[f], 'font');
        if (suivi) {
          // Page publique de suivi : le jeton du lien ne part jamais en en-tête Referer, dès la première requête.
          var meta = document.createElement('meta');
          meta.name = 'referrer';
          meta.content = 'no-referrer';
          document.head.appendChild(meta);
          // Blocs JS de l'écran de suivi téléchargés tout de suite, en parallèle de l'application (liste écrite par
          // scripts/web-postexport.mjs). La carte vient ENSUITE : en 3G, MapLibre (≈ 270 ko) et le bloc principal de
          // l'application (≈ 290 ko) se partageraient la bande passante, et l'heure d'arrivée, le code et le montant
          // attendraient la carte (mesure « Fast 3G » : 7,2 s → 5,7 s jusqu'à l'heure d'arrivée). MapLibre et le style
          // Cobalt (/map/cobalt-style.json, une requête de moins une fois la carte prête) partent dès que le bloc
          // principal est arrivé ; connexion très lente : l'application les demande elle-même, après le suivi.
          var urls = /*YAAR_SUIVI_PRELOAD*/[];
          var mapUrls = [];
          for (var i = 0; i < urls.length; i++) {
            if (urls[i].indexOf('maplibre-gl-') >= 0) mapUrls.push(urls[i]);
            else preload(urls[i], 'script');
          }
          var mapStarted = slow;
          var startMap = function () {
            if (mapStarted) return;
            mapStarted = true;
            for (var k = 0; k < mapUrls.length; k++) preload(mapUrls[k], 'script');
            preload('/map/cobalt-style.json', 'fetch');
          };
          if (!slow && window.PerformanceObserver) {
            try {
              var entryDone = new PerformanceObserver(function (list) {
                var entries = list.getEntries();
                for (var e = 0; e < entries.length; e++) {
                  if (/\/entry-[^/]*\.js$/.test(entries[e].name)) {
                    entryDone.disconnect();
                    startMap();
                  }
                }
              });
              entryDone.observe({ type: 'resource', buffered: true });
            } catch (err) {
              /* navigateur sans « resource timing » : au plus tard à DOMContentLoaded (ci-dessous) */
            }
          }
          document.addEventListener('DOMContentLoaded', startMap);
          // Tuiles et noms de quartiers de la carte (autre domaine) : connexion ouverte d'avance (DNS + TLS : plusieurs
          // allers-retours en 3G), sans rien télécharger.
          if (!slow) {
            var pc = document.createElement('link');
            pc.rel = 'preconnect';
            pc.href = 'https://tiles.openfreemap.org';
            pc.crossOrigin = 'anonymous';
            document.head.appendChild(pc);
          }
          var text = document.getElementById('yaar-splash-text');
          if (text) text.textContent = 'Chargement du suivi de votre colis…';
        }
        setTimeout(function () {
          var splash = document.getElementById('yaar-splash');
          if (splash) splash.remove();
        }, 20000);
      })();
    </script>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
