<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      Écran de démarrage (Yaar Livraison) : affiché dès les premiers octets de la page, sans attendre le JavaScript
      (≈ 1 Mo compressé, plusieurs secondes en 3G). L'application le retire dès qu'un écran est prêt
      (src/lib/webShell.ts) ; filet de sécurité ci-dessous au bout de 20 s.
    -->
    <style id="yaar-splash-css">
      /* Couleurs du système Cobalt (src/theme.ts) ; police du système : celle de l'application n'est pas encore là. */
      #yaar-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #eef1f5;
        color: #0c1222;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 0.25s ease;
      }
      #yaar-splash .logo {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1;
      }
      #yaar-splash .logo i {
        width: 12px;
        height: 12px;
        margin-bottom: 7px;
        border-radius: 50%;
        background: #2448ff;
      }
      #yaar-splash .sub {
        font-size: 15px;
        font-weight: 600;
        color: #5b6475;
      }
      #yaar-splash .spin {
        width: 30px;
        height: 30px;
        margin-top: 22px;
        border-radius: 50%;
        border: 3px solid #e9edff;
        border-top-color: #2448ff;
        animation: yaar-spin 0.9s linear infinite;
      }
      #yaar-splash .msg {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 500;
        color: #5b6475;
      }
      @keyframes yaar-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #yaar-splash .spin {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>

  <body>
    <div id="yaar-splash" role="status" aria-live="polite">
      <div class="logo">Yaar<i></i></div>
      <div class="sub">Livraison · Ouagadougou</div>
      <div class="spin" aria-hidden="true"></div>
      <div class="msg" id="yaar-splash-text">Chargement…</div>
    </div>
    <script>
      (function () {
        var path = location.pathname;
        var conn = navigator.connection;
        // Connexion très lente (2G, « 3G lente », économie de données) : même règle que src/lib/webShell.ts.
        var slow = !!conn && (conn.saveData === true || /(^|-)2g$/.test(conn.effectiveType || ''));
        var suivi = path.indexOf('/suivi/') === 0;
        function preload(href, as) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = as;
          link.href = href;
          // Police : demandée en mode CORS par @font-face ; sans crossorigin, le préchargement ne servirait pas.
          if (as === 'font') link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        }
        // Polices de l'application (src/fonts.ts, graisses chargées au démarrage ; liste écrite par
        // scripts/web-postexport.mjs) : téléchargées tout de suite, en parallèle du JavaScript, pour que l'application
        // s'affiche directement dans sa police. Pas sur la page publique de suivi (ouverte depuis un SMS, souvent en
        // 3G) : le JavaScript du suivi d'abord ; l'application demande les polices ensuite et les substitue à leur
        // arrivée (aussitôt quand elles sont déjà en cache), jamais sur une connexion très lente.
        var fonts = /*YAAR_FONT_PRELOAD*/[];
        if (!suivi) for (var f = 0; f < fonts.length; f++) preload(fonts[f], 'font');
        if (suivi) {
          // Page publique de suivi : le jeton du lien ne part jamais en en-tête Referer, dès la première requête.
          var meta = document.createElement('meta');
          meta.name = 'referrer';
          meta.content = 'no-referrer';
          document.head.appendChild(meta);
          // Blocs JS de la page (carte comprise) téléchargés tout de suite, en parallèle de l'application
          // (liste écrite par scripts/web-postexport.mjs). Connexion très lente : MapLibre (≈ 270 ko) n'est pas
          // préchargé ici, pour ne pas retarder le suivi lui-même (code, heure d'arrivée) ; l'application le demande
          // dès l'ouverture de l'écran de suivi.
          var urls = /*YAAR_SUIVI_PRELOAD*/[];
          for (var i = 0; i < urls.length; i++) {
            if (slow && urls[i].indexOf('maplibre-gl-') >= 0) continue;
            preload(urls[i], 'script');
          }
          var text = document.getElementById('yaar-splash-text');
          if (text) text.textContent = 'Chargement du suivi de votre colis…';
        }
        setTimeout(function () {
          var splash = document.getElementById('yaar-splash');
          if (splash) splash.remove();
        }, 20000);
      })();
    </script>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
